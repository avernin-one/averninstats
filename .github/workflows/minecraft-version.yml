---
name: 🔄 Minecraft Version Check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CONFIG_FILE: pkg/config/config.go
  README_FILE: README.md
  MANIFEST_URL: https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

jobs:
  check:
    name: 🔄 Check for new release
    runs-on: ubuntu-latest
    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 🔍 Compare versions
        id: version
        run: |
          set -euo pipefail

          remote="$(curl --proto '=https' --tlsv1.2 -fsSL "${MANIFEST_URL}" | jq -r '.latest.release')"
          current="$(sed -nE 's/.*"minecraft-version", "([^"]+)".*/\1/p' "${CONFIG_FILE}")"

          # Only accept plain version numbers, the value ends up in sed,
          # branch names and commit messages.
          if ! [[ "${remote}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::unexpected remote version '${remote}'"
            exit 1
          fi

          if [[ -z "${current}" ]]; then
            echo "::error::target Minecraft version not found in ${CONFIG_FILE}"
            exit 1
          fi

          echo "current: ${current}, remote: ${remote}"

          newest="$(printf '%s\n%s\n' "${current}" "${remote}" | sort -V | tail -1)"
          if [[ "${remote}" == "${current}" || "${newest}" != "${remote}" ]]; then
            echo "already up to date"
            echo "update=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          {
            echo "update=true"
            echo "current=${current}"
            echo "remote=${remote}"
          } >> "${GITHUB_OUTPUT}"

      - name: 🚀 Create pull request
        if: steps.version.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.version.outputs.current }}
          REMOTE: ${{ steps.version.outputs.remote }}
        run: |
          set -euo pipefail

          branch="chore/minecraft-${REMOTE}"

          if git ls-remote --exit-code --heads origin "${branch}" > /dev/null; then
            echo "branch ${branch} already exists, skipping"
            exit 0
          fi

          sed -i -E "s/(\"minecraft-version\", \")[^\"]+(\")/\1${REMOTE}\2/" "${CONFIG_FILE}"

          # README: help output default and usage examples.
          sed -i -E \
            -e "s/(Target Minecraft version \(default \")[^\"]+(\")/\1${REMOTE}\2/" \
            -e "s/(--minecraft-version )[0-9][0-9.]*/\1${REMOTE}/g" \
            "${README_FILE}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -am "chore(config): bump minecraft version to ${REMOTE}"
          git push origin "${branch}"

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${branch}" \
            --title "chore(config): bump minecraft version to ${REMOTE}" \
            --body "$(cat <<EOF
          Minecraft **${REMOTE}** has been released.

          This PR updates the default target Minecraft version in \`${CONFIG_FILE}\` and \`${README_FILE}\`:

          | | Version |
          |---|---|
          | Current | \`${CURRENT}\` |
          | Latest release | \`${REMOTE}\` |

          Source: [version manifest](${MANIFEST_URL})

          Before merging, check that language files and stats keys of the new version are processed correctly.
          EOF
          )"
